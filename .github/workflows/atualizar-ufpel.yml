# © 2026 Gerador de Horários — Marlon Sigales. Atualiza os dados do portal institucional da UFPel todo dia.
name: Atualizar dados da UFPel
on:
  schedule:
    - cron: '17 6 * * *'   # 03:17 em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-ufpel
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock linkedom@0.18
      - run: node tools/atualizar-ufpel.mjs
        env:
          ORCAMENTO_MIN: '55'
      - name: Gravar se mudou
        run: |
          git config user.name "atualizador-ufpel"
          git config user.email "actions@users.noreply.github.com"
          git add data/ufpel
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Dados da UFPel atualizados ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
